# Publishes the garden to GitHub Pages on every push to main, or by hand, through the sites'
# workflow (AriaMoKr/common's .github/workflows/pages.yml): npm ci (which copies three.js, common,
# the shared session and IWER into public/vendor/), npm test, then public/ as it is, deployed. On
# the current Node LTS (24).
#
# One-time setup: the repository's Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: AriaMoKr/common/.github/workflows/pages.yml@v0.6.1
